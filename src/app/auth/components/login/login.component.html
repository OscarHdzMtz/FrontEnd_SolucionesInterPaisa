<p-toast></p-toast>

<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
  <div class="flex flex-column align-items-center justify-content-center">
    <img src="assets/layout/images/{{
                layoutService.config.colorScheme === 'light'
                    ? 'logo-dark'
                    : 'logo-white'
            }}.svg" alt="Sakai logo" class="mb-5 w-6rem flex-shrink-0" />
    <div style="
                border-radius: 56px;
                padding: 0.3rem;
                background: linear-gradient(
                    180deg,
                    var(--primary-color) 10%,
                    rgba(33, 150, 243, 0) 30%
                );
            ">
      <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius: 53px">
        <div class="text-center mb-5">
          <img src="assets/demo/images/login/avatar.png" alt="Image" height="50" class="mb-3" />
          <div class="text-900 text-3xl font-medium mb-3">
            BIENVENIDO!
          </div>
          <span class="text-600 font-medium">Iniciar sesión</span>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="authSubmit()">
          <div>
            <label for="email1" class="block text-900 text-xl font-medium mb-2">Correo</label>
            <input pInputText class="w-full md:w-30rem mb-5" style="padding: 1rem" formControlName="correo" />

            <label for="password1" class="block text-900 font-medium text-xl mb-2">Contraseña</label>
            <p-password [toggleMask]="true" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"
              formControlName="password"></p-password>

            <div class="flex align-items-center justify-content-between mb-5 gap-5">
              <div class="flex align-items-center">
                <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
                <label for="rememberme1">Recordar</label>
              </div>
              <a class="font-medium no-underline ml-2 text-right cursor-pointer"
                style="color: var(--primary-color)">¿Has olvidado tu contraseña?</a>
            </div>

            <!-- Deshabilitar el botón cuando el formulario no es válido o se está enviando la solicitud -->
            <button type="submit" [disabled]="!loginForm.valid || isSubmitting" pButton pRipple label="Iniciar sesión"
              class="w-full p-3 text-xl"></button>
            <!-- Mostrar barra de progreso solo mientras se está enviando -->
            <p-progressBar *ngIf="isSubmitting" mode="indeterminate"
              [style]="{ height: '6px', marginTop: '10px' }"></p-progressBar>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal de error -->
<p-dialog header="¡Error!" [(visible)]="showErrorDialog" [modal]="true" [closable]="true" [dismissableMask]="true"
  [style]="{ width: '25vw' }"
  contentStyleClass="flex flex-column align-items-center justify-content-center text-center shadow-lg">
  <!-- Ícono de error más grande -->
  <i class="pi pi-times-circle text-red-600 text-8xl mb-4"></i>
  <!-- Aumentamos el tamaño y cambiamos el color a rojo brillante -->

  <!-- Mensaje de error -->
  <p class="text-xl text-900 font-semibold mb-4">{{ errorMessage }}</p>
